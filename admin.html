*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}

main{padding:14px;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:left;font:inherit;color:inherit;position:relative}
.tile i{font-style:normal;font-size:26px;display:block}.tile span{font-weight:600}
.badge{position:absolute;top:8px;right:8px;background:var(--rd);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}

.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.sub{color:var(--mu);font-size:13px;margin:2px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button.b{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px}
button.p{background:var(--g);color:#fff}button.d{border-color:var(--rd);color:var(--rd)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px}
.chips .on{background:var(--g);color:#fff;border-color:var(--g)}
.st{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--g2);color:var(--g)}.st.Menunggu{background:#fff1cc;color:var(--am)}.st.Ditolak{background:#fde3e1;color:var(--rd)}
.ph{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.ph img{height:80px;border-radius:6px}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#sheet.on{display:flex}
#sheet>div{background:#fff;width:100%;max-height:88vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90%}#toast.on{display:block}
.login{max-width:360px;margin:12vh auto;padding:0 18px}.login h1{font-size:22px;margin:0 0 4px}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;min-height:90px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}th,td{border:1px solid #888;padding:5px 6px;text-align:left;vertical-align:top}th{background:var(--g2)}td.r,th.r{text-align:right}
.ttd{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-top:28px;font-size:13px}.ttd div{min-height:90px}
@media print{header,.noprint,#sheet,#toast{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0;padding:0}img{max-width:100%}tr{break-inside:avoid}}

 window._d=d}

 $('#sh').innerHTML=`<b>${r?'Ubah':'Tambah'} ${c.j}</b>`+c.f.map(([f,l,t,o])=>{const v=r?r[f]??'':(t==='date'?today():'');let x;

 $('#sheet').className='on'}

 for(const[f,,t]of c.f){let v=$('#f_'+f).value;if(v==='')v=null;else if(t==='number')v=Number(v);else if(v==='true'||v==='false')v=v==='true';o[f]=v}

 let p=sb.from('laporan_alsintan').select('*').order('tgl',{ascending:false}).limit(60);if(LF)p=p.eq('status_verifikasi',LF);

 (d.map(r=>`<div class="card"><b>${E(lbl('alsintan',r.alsintan_id))}</b> <span class="st ${r.status_verifikasi}">${r.status_verifikasi}</span>

 await q(sb.rpc('buat_sewa_dari_laporan',{p_laporan_id:id,p_penyewa:p,p_status:st}));toast('Sewa dibuat');laporan()}

 const rw=[...ck.map(c=>({rapat_id:id,anggota_id:+c.value,hadir:c.checked})),...tm.map(x=>({rapat_id:id,nama_tamu:x.n,instansi:x.i||null,ttd_path:x.p||null,hadir:true}))];
 if(rw.length)await q(sb.from('rapat_peserta').insert(rw));
 for(let i=0;i<RF.length;i++){const path=`rapat/${id}/${Date.now()}_${i}.jpg`,{error}=await sb.storage.from('foto-brigade').upload(path,RF[i].blob,{contentType:'image/jpeg'});

async function kas(){
 const all=await q(sb.from('kas').select('*').order('tgl',{ascending:false}).limit(1000)),

 mi=sm(d,r=>r.jenis=='masuk'?r.nominal:0),ke=sm(d,r=>r.jenis=='keluar'?r.nominal:0),um=await sUrls(d.map(r=>r.bukti_path).filter(Boolean)),kt={};
 d.forEach(r=>{const k=(r.jenis=='masuk'?'Masuk • ':'Keluar • ')+(r.kategori_id?lbl('kategori_kas',r.kategori_id):'Tanpa kategori');kt[k]=(kt[k]||0)+Number(r.nominal)});window._k=d;

 d.map(r=>{const au=r.sewa_id||r.iuran_id||r.pembayaran_id;return `<div class="card"><b>${E(r.uraian)}</b><div class="sub">${r.tgl} • ${r.kategori_id?E(lbl('kategori_kas',r.kategori_id)):'Tanpa kategori'} • ${r.jenis=='masuk'?'+':'-'} Rp ${n(r.nominal)}</div>
