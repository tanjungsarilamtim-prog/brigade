<style>
:root{
 --g:#1f5132;--g-mid:#2e6f46;--g-soft:#e6f0ea;--g-tint:#f4f8f5;
 --bg:#eef3ef;--card:#ffffff;--tx:#16241b;--mu:#5a6b60;--bd:#d3dfd6;

}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top right,#e3efe6 0%,var(--bg) 52%,#e8efe9 100%);color:var(--tx);padding-bottom:48px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g) 0%,var(--g-mid) 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 4px 16px rgba(22,36,27,.14)}
header b{flex:1;font-size:17px;font-weight:700;letter-spacing:.2px}
header button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;transition:.15s}
header button:hover{background:rgba(255,255,255,.24)}
header select{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:#fff;border-radius:8px;font-weight:600;cursor:pointer}
header select option{color:var(--tx);background:#fff}
main{padding:16px 14px;max-width:720px;margin:0 auto}

.hero-card{background:linear-gradient(135deg,#184329 0%,#26613c 55%,#347a4d 100%);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh-md);position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;right:-28px;top:-28px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-org{font-size:11px;text-transform:uppercase;letter-spacing:.9px;opacity:.85;font-weight:700}
.hero-user{font-size:12px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.saldo-box{margin-top:12px}
.saldo-box small{display:block;opacity:.85;font-size:12.5px}
.saldo-box b{display:block;font-size:28px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.hero-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:8px 10px}
.hero-pill span{display:block;font-size:11px;opacity:.82}
.hero-pill strong{display:block;font-size:15px;font-weight:700;margin-top:1px}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi-mini{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;box-shadow:var(--sh-sm)}
.kpi-mini strong{display:block;font-size:15px;font-weight:800;color:var(--tx);line-height:1.2}
.kpi-mini span{display:block;font-size:11px;color:var(--mu);font-weight:600;margin-top:2px}
.kpi-mini.warn{border-color:#f3c677;background:#fffdf7}
.kpi-mini.warn strong{color:var(--am)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center;font:inherit;color:inherit;position:relative;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:82px}
.tile:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:#9eb8a6}
.tile:active{transform:translateY(0)}
.tile i{font-style:normal;font-size:20px;width:34px;height:34px;border-radius:10px;background:var(--g-soft);display:inline-flex;align-items:center;justify-content:center}
.tile span{font-weight:700;font-size:12.5px;color:var(--tx);line-height:1.25}

button.p{background:linear-gradient(135deg,var(--g) 0%,var(--g-mid) 100%);color:#fff;border-color:var(--g)}

label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}

.menu-btn{font-size:18px;line-height:1;padding:6px 10px}
#drawer{position:fixed;inset:0;background:rgba(15,23,18,.48);backdrop-filter:blur(2px);display:none;z-index:25}
#drawer.on{display:flex}
.drawer-panel{width:280px;max-width:84vw;height:100%;background:#fff;padding:16px 14px;overflow-y:auto;box-shadow:6px 0 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--bd)}

.drawer-close{background:var(--g-soft);border:0;color:var(--tx);border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}

.d-item.active{background:var(--g-soft);color:var(--g)}
.d-left{display:flex;align-items:center;gap:10px}
.d-badge{background:var(--rd);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}

</style></head><body>
<div id="app"></div><div id="drawer" onclick="if(event.target===this)toggleDrawer(false)"></div><div id="sheet"><div id="sh"></div></div><div id="toast"></div>
<script>

const KOP_KEY='bp_kop_resmi_v14_v7';
const DEFAULT_KOP={
 nama:'BRIGADE PANGAN TANI SEJAHTERA BERSAMA',
 desa:'DESA TANJUNG SARI KECAMATAN JABUNG LAMPUNG TIMUR',
 alamat:'Alamat sekretariat : jln.raya Desa Tanjung Sari RT.003/001 Desa Tanjung Sari Kec. Jabung Kab. Lampung Timur',
 logo:''
};
function getKop(){
 try{
  const raw=localStorage.getItem(KOP_KEY);
  if(!raw)return {...DEFAULT_KOP};
  const parsed=JSON.parse(raw);
  const merged={...DEFAULT_KOP,...(parsed&&typeof parsed==='object'?parsed:{})};
  if(
   merged.desa==='Desa Tanjung Sari, Kecamatan Jabung' &&
   merged.alamat==='Kabupaten Lampung Timur, Provinsi Lampung'
  ){
   merged.desa=DEFAULT_KOP.desa;
   merged.alamat=DEFAULT_KOP.alamat;
  }
  return merged;
 }catch(e){return {...DEFAULT_KOP};}
}
function setKop(obj){
 const next={...getKop(),...(obj||{})};
 try{localStorage.setItem(KOP_KEY,JSON.stringify(next));}catch(e){}
 return next;
}
function aturKopSurat(){
 const k=getKop();
 $('#sh').innerHTML=`<b>Pengaturan Kop Surat Resmi</b>
  <div class="sub">Kop ini dipakai otomatis pada rekap laporan, surat perjanjian, berita acara, dan nota/tagihan PDF.</div>
  <label>Nama Brigade</label><input id="kop_nama" value="${E(k.nama)}">
  <label>Nama Desa / Kecamatan</label><input id="kop_desa" value="${E(k.desa)}">
  <label>Alamat Lengkap</label><input id="kop_alamat" value="${E(k.alamat)}">
  <label>Logo Brigade (Gambar / PNG / JPG)</label>
  <input id="kop_file" type="file" accept="image/*" onchange="kopPickLogo(this.files)">
  <div id="kop_prev" style="margin-top:8px;display:flex;align-items:center;gap:10px">${k.logo?`<img src="${safeUrl(k.logo)||k.logo.startsWith('data:image/')?E(k.logo):''}" style="height:56px;width:56px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;padding:3px;background:#fff"><button class="b d" type="button" onclick="kopHapusLogo()">Hapus Logo</button>`:'<span class="sub">Belum ada logo dipilih.</span>'}</div>
  <div class="row"><button class="b p" type="button" onclick="kopSimpan()">Simpan Kop Surat</button><button class="b" type="button" onclick="kopReset()">Reset Default</button><button class="b" type="button" onclick="shut()">Batal</button></div>`;
 $('#sheet').className='on';
}
function kopHapusLogo(){
 setKop({logo:''});
 aturKopSurat();
 toast('Logo brigade dihapus');
}
function kopReset(){
 setKop({...DEFAULT_KOP});
 aturKopSurat();
 toast('Kop surat dikembalikan ke bawaan');
}
async function kopPickLogo(files){
 const f=files&&files[0];
 if(!f)return;
 const blob=await comp(f);
 const reader=new FileReader();
 reader.onload=()=>{
  const dataUrl=String(reader.result||'');
  if(dataUrl.startsWith('data:image/')){
   setKop({logo:dataUrl});
   aturKopSurat();
   toast('Logo brigade siap disimpan');
  }
 };
 reader.readAsDataURL(blob);
}
function kopSimpan(){
 const nama=($('#kop_nama')?.value||'').trim()||DEFAULT_KOP.nama;
 const desa=($('#kop_desa')?.value||'').trim();
 const alamat=($('#kop_alamat')?.value||'').trim();
 setKop({nama,desa,alamat});
 shut();
 toast('Kop surat resmi tersimpan');
 render();
}
function kopHtml(judulDoc,subDoc){
 const k=getKop();
 const imgSrc=(k.logo&&(k.logo.startsWith('data:image/')||safeUrl(k.logo)))?k.logo:'';
 const kopTop=`<div class="kop-resmi" style="display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:3px double #16241b;margin-bottom:10px;text-align:left">
  ${imgSrc?`<img src="${E(imgSrc)}" alt="Logo Brigade" style="width:64px;height:64px;object-fit:contain;flex-shrink:0">`:''}
  <div style="flex:1;min-width:0;text-align:center">
   <div style="font-size:15px;font-weight:800;letter-spacing:.3px;color:var(--tx);text-transform:uppercase">${E(k.nama)}</div>
   ${k.desa?`<div style="font-size:12px;font-weight:700;color:var(--tx);margin-top:2px;text-transform:uppercase">${E(k.desa)}</div>`:''}
   ${k.alamat?`<div style="font-size:11.5px;font-weight:500;color:var(--tx);margin-top:2px;line-height:1.35">${E(k.alamat)}</div>`:''}
  </div>
 </div>`;
 const judulBlock=(judulDoc||subDoc)?`<div style="text-align:center;margin:4px 0 12px">
  ${judulDoc?`<div style="font-size:13.5px;font-weight:800;text-transform:uppercase;color:var(--tx);letter-spacing:.3px">${E(judulDoc)}</div>`:''}
  ${subDoc?`<div class="sub" style="margin:2px 0 0;color:var(--tx)">${E(subDoc)}</div>`:''}
 </div>`:'';
 return kopTop+judulBlock;
}
function applyKopPdf(doc,judulDoc,subDoc,pageWidth){
 const k=getKop();
 const centerX=pageWidth/2;
 const rightX=pageWidth-14;
 let y=15;
 const hasLogo=k.logo && k.logo.startsWith('data:image/');
 if(hasLogo){
  const fmt=k.logo.includes('image/png')?'PNG':'JPEG';
  try{
   doc.addImage(k.logo,fmt,14,11,16,16);
  }catch(e){}
 }
 const textCenterX=hasLogo?(centerX+7):centerX;
 const maxTextW=hasLogo?(rightX-(textCenterX-10)):(rightX-28);
 doc.setFont('helvetica','bold');
 doc.setFontSize(11);
 const wrappedNama=doc.splitTextToSize(String(k.nama||DEFAULT_KOP.nama).toUpperCase(),maxTextW);
 doc.text(wrappedNama,textCenterX,y,{align:'center'});
 y+=(wrappedNama.length*4.2);
 if(k.desa){
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  const wrappedDesa=doc.splitTextToSize(String(k.desa).toUpperCase(),maxTextW);
  doc.text(wrappedDesa,textCenterX,y,{align:'center'});
  y+=(wrappedDesa.length*3.8);
 }
 if(k.alamat){
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  const wrappedAddr=doc.splitTextToSize(String(k.alamat),maxTextW);
  doc.text(wrappedAddr,textCenterX,y,{align:'center'});
  y+=(wrappedAddr.length*3.6);
 }
 const lineY=Math.max(y+1.5,29.5);
 doc.setLineWidth(0.7);
 doc.line(14,lineY,rightX,lineY);
 doc.setLineWidth(0.25);
 doc.line(14,lineY+1.1,rightX,lineY+1.1);
 let curY=lineY+7;
 if(judulDoc){
  doc.setFont('helvetica','bold');
  doc.setFontSize(10.5);
  doc.text(String(judulDoc).toUpperCase(),centerX,curY,{align:'center'});
  curY+=5;
 }
 if(subDoc){
  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.text(String(subDoc),centerX,curY,{align:'center'});
  curY+=6;
 }
 return curY;
}

function lupa(){const e=($('#em').value||'').trim().toLowerCase();if(!e)return toast('Isi email dulu');sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(r=>toast(r.error?'Gagal: '+r.error.message:'Tautan reset dikirim ke email Anda'))}
const $=s=>document.querySelector(s),n=v=>Number(v||0).toLocaleString('id-ID'),today=()=>new Date().toISOString().slice(0,10);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const findJab=j=>(C.anggota||[]).find(x=>String(x.jabatan||'').trim().toLowerCase()===String(j||'').trim().toLowerCase())||{};

const lbl=(k,id)=>{const r=(C[k]||[]).find(x=>x.id==id);return r?r[R[k]]:'-'};
const ST=['Dijadwalkan','Berjalan','Selesai','Dibatalkan'],JAB=['Ketua Brigade','Sekretaris','Bendahara','Koordinator Alsintan','Operator Alsintan','Anggota Petani'];

const T={
 jadwal_alsintan:{j:'Jadwal',i:'📅',o:'tgl',f:[['tgl','Tanggal','date'],['alsintan_id','Alsintan','ref','alsintan'],['operator_id','Operator','ref','profiles'],['lahan_id','Lahan','ref','lahan'],['keperluan','Keperluan'],['status','Status','sel',ST]],t:r=>lbl('alsintan',r.alsintan_id)+' → '+lbl('profiles',r.operator_id),s:r=>`${r.tgl} • ${lbl('lahan',r.lahan_id)} • ${r.status}`},
 lahan:{j:'Lahan',i:'🌾',o:'id',f:[['nama_blok','Nama blok'],['kelompok_tani','Kelompok tani'],['luas_ha','Luas (Ha)','number'],['anggota_id','Pemilik','ref','anggota']],t:r=>r.nama_blok,s:r=>`${r.luas_ha} Ha • ${lbl('anggota',r.anggota_id)}`},
 alsintan:{j:'Alsintan',i:'🚜',o:'id',f:[['nama','Nama alat'],['jenis','Jenis'],['kode','Kode / no. seri'],['jumlah','Jumlah','number'],['kondisi','Kondisi','sel',['Baik / Siap Pakai','Perlu Servis Ringan','Rusak Berat']],['tarif_anggota','Tarif Anggota / Ha (Rp)','number'],['tarif_umum','Tarif Petani Umum / Ha (Rp)','number'],['tarif_per_ha','Tarif Dasar / Ha (Rp)','number']],t:r=>r.nama,s:r=>{const a=r.tarif_anggota??r.tarif_per_ha,u=r.tarif_umum??r.tarif_per_ha;return `${r.kondisi} • Anggota: Rp ${n(a)}/Ha • Umum: Rp ${n(u)}/Ha`}},

}

function normWa(hp){
 let s=String(hp||'').replace(/[^0-9]/g,'');
 if(!s)return '';
 if(s.startsWith('0'))s='62'+s.slice(1);
 else if(s.startsWith('8'))s='62'+s;
 return s;
}

const addDaysIndo=(d,days)=>{

  const isLunas=String(r.status||'').toLowerCase()==='lunas' || Math.max(0,b-d)===0;
  return a+(isLunas?0:Math.max(0,b-d));
 },0);
